# Field-of-interest taxonomy → drives Explorer filter chips + card accent colors.
# Muted, mid-lightness OKLCH hues: enough chroma to carry identity on chips,
# accent bars, and hover rings in both themes, without turning the site rainbow.
# Hues sit ≥ 35° apart around the wheel so no two chips read as the same colour.
- label: "NLP"
  color: "oklch(0.56 0.13 275)"
  icon: "sparkle"
- label: "Graph ML"
  color: "oklch(0.6 0.11 205)"
  icon: "graph"
- label: "Legal AI"
