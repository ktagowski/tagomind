baseURL: "https://tagomind.com/"
title: "TagoMind · Kamil Tagowski, PhD"

# Multilingual: English is the site and keeps its root URLs. Polish exists only for the pages that have a
# *.pl.md translation (today: services), served under /pl/; the generated Polish home/section/RSS pages are
# disabled so nothing empty is published. Templates link with relURL (English) except the Services nav entry.
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: "English"
    languageCode: "en-US"
    weight: 1
  pl:
    languageName: "Polski"
    languageCode: "pl-PL"
    weight: 2
    title: "TagoMind · dr inż. Kamil Tagowski"
    disableKinds: ["home", "section", "taxonomy", "term", "RSS", "404"]
enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true

# --- Tailwind CSS v4 asset pipeline (css.TailwindCSS reads hugo_stats.json) ---
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: 'css'
    - source: '(postcss|tailwind)\.config\.js'
      target: 'css'
module:
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

# Field-of-interest taxonomy drives the Explorer filter chips + card accents.
taxonomies:
  field: fields

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark
  tableOfContents:
    startLevel: 2
    endLevel: 3

sitemap:
  changefreq: weekly
  priority: 0.5

# Plain-text summary for LLM crawlers → /llms.txt (template: layouts/home.llms.txt)
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
outputs:
  home: ["HTML", "RSS", "llms"]

# Fields are consumed only as filter chips inside the Explorer, not as own pages.
disableKinds:
  - taxonomy
  - term

