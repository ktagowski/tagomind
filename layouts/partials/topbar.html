<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="{{ "/" | relURL }}">
      <span class="glyph">{{ partial "icon.html" (dict "name" "graph" "class" "size-4") }}</span>
      <span>Tago<b>Mind</b></span>
    </a>
    <nav class="nav-row" aria-label="{{ i18n "aria_primary_nav" }}">{{ partial "nav-links.html" (dict "page" . "variant" "top") }}</nav>
    <div class="topbar-controls">
      <button class="icon-btn" data-theme-toggle aria-label="{{ i18n "aria_toggle_theme" }}" aria-pressed="false">
        <span class="hidden dark:inline">{{ partial "icon.html" (dict "name" "sun" "class" "size-5") }}</span>
        <span class="inline dark:hidden">{{ partial "icon.html" (dict "name" "moon" "class" "size-5") }}</span>
      </button>
      <a class="btn btn-sm btn-primary hidden sm:inline-flex" href="{{ "/research/#collaborate" | relURL }}">
        {{ partial "icon.html" (dict "name" "mail" "class" "size-4") }}<span class="hidden md:inline">{{ i18n "research_collaborate" }}</span>
      </a>
      <button class="icon-btn lg:hidden" data-nav-toggle aria-label="{{ i18n "aria_open_menu" }}" aria-expanded="false" aria-controls="mobile-nav">
        {{ partial "icon.html" (dict "name" "menu" "class" "size-5") }}
      </button>
    </div>
  </div>
</header>
